name: Bug report
description: Something on the desk is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Hosted (job-not-finished.vercel.app)
        - Self-hosted
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Browser, screenshots, or server logs (remove anything private).
